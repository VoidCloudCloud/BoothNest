[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boothnest-desktop"
dynamic = ["version"]
description = "A local, read-only BOOTH download catalog for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/VoidCloudCloud/BoothNest"
Repository = "https://github.com/VoidCloudCloud/BoothNest.git"
Issues = "https://github.com/VoidCloudCloud/BoothNest/issues"
Changelog = "https://github.com/VoidCloudCloud/BoothNest/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "boothlib.__version__"}

[tool.setuptools]
packages = ["boothlib"]

[tool.setuptools.package-data]
boothlib = ["ui.html"]
